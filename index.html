<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARCADE HUB 18-в-1</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0;padding:0}
body{background:#090b1a;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:#141736;border-bottom:1px solid #2e346b;display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;font-weight:900;background:linear-gradient(90deg,#00f2fe,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#back{background:#ff007f;border:none;color:#fff;padding:6px 12px;border-radius:8px;font-weight:bold;font-size:12px;display:none}
#tabs{display:flex;gap:8px;padding:10px 12px;background:#0d1026;overflow-x:auto}
.tab{background:#181c40;border:1px solid #2d3573;color:#a0a8d6;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap}
.tab.active{background:#ff007f;color:#fff;border-color:#ff007f}
#grid{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.card{background:#15193b;border:1px solid #293066;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-height:100px}
.card:active{transform:scale(0.96);border-color:#00f2fe}
.badge{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:800;width:fit-content}
.b-solo{background:rgba(0,242,254,0.15);color:#00f2fe;border:1px solid #00f2fe}
.b-2p{background:rgba(255,0,127,0.2);color:#ff4da6;border:1px solid #ff007f}
.b-party{background:rgba(241,196,15,0.2);color:#f1c40f;border:1px solid #f1c40f}
.card h3{font-size:13px;margin:5px 0 2px}
.card p{font-size:11px;color:#8c95c9}
#view{display:none;flex:1;flex-direction:column;position:relative;touch-action:none;overflow:hidden}
.topbar{padding:8px 14px;background:#121633;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold}
.mbtn{background:#222859;border:1px solid #3c4594;color:#fff;padding:5px 10px;border-radius:6px;font-size:11px}
.mbtn.on{background:#00f2fe;color:#000;font-weight:bold}
canvas{display:block;width:100%;flex:1}
.box-grid{margin:auto;display:grid;gap:6px;padding:10px}
.cell{background:#1b204d;border:1px solid #353f8a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}
.panel{margin:auto;width:90%;background:#14183b;border:2px solid #2e377a;border-radius:16px;padding:20px;text-align:center}
.abtn{background:linear-gradient(90deg,#00f2fe,#4facfe);color:#000;border:none;padding:12px;border-radius:10px;font-weight:900;font-size:14px;width:100%;margin-top:10px}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center}
.rot{transform:rotate(180deg);background:rgba(0,242,254,0.08);border-bottom:2px dashed #2e377a}
.norm{background:rgba(255,0,127,0.08)}
</style>
</head>
<body>
<header><h1 id="title">ARCADE HUB • 18 ИГР</h1><button id="back" onclick="home()">← МЕНЮ</button></header>
<div id="tabs">
    <div class="tab active" onclick="setTab('all',this)">Все (18)</div>
    <div class="tab" onclick="setTab('solo',this)">Соло (8)</div>
    <div class="tab" onclick="setTab('2p',this)">На двоих 1×1 (6)</div>
    <div class="tab" onclick="setTab('party',this)">Компания (4)</div>
</div>
<div id="grid"></div>
<div id="view"></div>
<script>
if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.expand();
let raf=null,tmr=null,curTab='all';

const GAMES=[
    {id:'flappy',name:'🦅 Кибер Флэппи',desc:'Полёт сквозь лазерные ворота',cat:'solo',tag:'СОЛО'},
    {id:'shooter',name:'🛸 Космо Защитник',desc:'Стреляй лазерами по флоту врагов',cat:'solo',tag:'СОЛО'},
    {id:'doodle',name:'🦘 Неон Джампер',desc:'Прыгай по платформам выше в небо',cat:'solo',tag:'СОЛО'},
    {id:'race',name:'🏎️ Турбо Шашки',desc:'Обгоняй машины на трассе',cat:'solo',tag:'СОЛО'},
    {id:'snake',name:'🐍 Кибер Змейка',desc:'Собирай блоки и расти в длину',cat:'solo',tag:'СОЛО'},
    {id:'arkanoid',name:'🧱 Неон Арканоид',desc:'Разбей все блоки шаром',cat:'solo',tag:'СОЛО'},
    {id:'mines',name:'💣 Сапёр 7×7',desc:'Найди все мины с флажками',cat:'solo',tag:'СОЛО'},
    {id:'g2048',name:'🔢 Неон 2048',desc:'Соединяй плитки свайпами',cat:'solo',tag:'СОЛО'},
    {id:'hockey',name:'🏒 Аэрохоккей',desc:'Матч 1×1 или против бота ИИ',cat:'2p',tag:'1×1 / ИИ'},
    {id:'tanks',name:'🚜 Танковый Баттл',desc:'Артиллерийская дуэль 1×1',cat:'2p',tag:'НА ДВОИХ'},
    {id:'duel',name:'🤠 Дикий Запад',desc:'Выстрели первым после сигнала',cat:'2p',tag:'НА ДВОИХ'},
    {id:'tug',name:'🪢 Перетягивание',desc:'Кто быстрее закликает экран',cat:'2p',tag:'НА ДВОИХ'},
    {id:'ttt',name:'❌ Крестики-Нолики',desc:'Против друга или умного ИИ',cat:'2p',tag:'1×1 / ИИ'},
    {id:'math',name:'⚡ Мат-Дуэль 1×1',desc:'Кто быстрее решит пример',cat:'2p',tag:'НА ДВОИХ'},
    {id:'spy',name:'🕵️ Шпион',desc:'Вычисли предателя в компании',cat:'party',tag:'КОМПАНИЯ'},
    {id:'mafia',name:'🔪 Мафия: Роли',desc:'Раздача тайных ролей по кругу',cat:'party',tag:'КОМПАНИЯ'},
    {id:'tod',name:'🎲 Правда / Действие',desc:'Вопросы и задания для класса',cat:'party',tag:'КОМПАНИЯ'},
    {id:'croc',name:'🐊 Крокодил',desc:'Покажи слово без единого звука',cat:'party',tag:'КОМПАНИЯ'}
];

function drawMenu(){
    const g=document.getElementById('grid');g.innerHTML='';
    GAMES.filter(x=>curTab==='all'||x.cat===curTab).forEach(x=>{
        const d=document.createElement('div');d.className='card';
        d.innerHTML=`<div><span class="badge b-${x.cat}">${x.tag}</span><h3>${x.name}</h3></div><p>${x.desc}</p>`;
        d.onclick=()=>openGame(x);g.appendChild(d);
    });
}
function setTab(t,el){curTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');drawMenu();}
function home(){cancelAnimationFrame(raf);clearInterval(tmr);clearTimeout(tmr);document.getElementById('view').style.display='none';document.getElementById('grid').style.display='grid';document.getElementById('tabs').style.display='flex';document.getElementById('back').style.display='none';document.getElementById('title').innerText='ARCADE HUB • 18 ИГР';}

function openGame(g){
    document.getElementById('grid').style.display='none';document.getElementById('tabs').style.display='none';document.getElementById('back').style.display='block';
    document.getElementById('title').innerText=g.name;const v=document.getElementById('view');v.style.display='flex';v.innerHTML='';
    const fn={flappy:gFlappy,shooter:gShooter,doodle:gDoodle,race:gRace,snake:gSnake,arkanoid:gArkanoid,mines:gMines,g2048:g2048,hockey:gHockey,tanks:gTanks,duel:gDuel,tug:gTug,ttt:gTTT,math:gMath,spy:gSpy,mafia:gMafia,tod:gTod,croc:gCroc};
    fn[g.id](v);
}
function gFlappy(v){
    v.innerHTML='<div class="topbar"><span id="s">Счёт: 0</span><span>Тапай для взлёта</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let y=c.height/2,vy=0,pipes=[],fr=0,sc=0,dead=false;
    c.ontouchstart=e=>{e.preventDefault();if(!dead)vy=-7;};
    function loop(){
        if(dead)return;fr++;ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);vy+=0.4;y+=vy;
        if(fr%85===0)pipes.push({x:c.width,top:60+Math.random()*(c.height-220),gap:135,p:false});
        pipes.forEach(p=>{p.x-=3.5;ctx.fillStyle='#ff007f';ctx.fillRect(p.x,0,46,p.top);ctx.fillRect(p.x,p.top+p.gap,46,c.height);if(!p.p&&p.x+46<70){p.p=true;sc++;document.getElementById('s').innerText='Счёт: '+sc;}if(84>p.x&&56<p.x+46&&(y-14<p.top||y+14>p.top+p.gap))dead=true;});
        if(y<0||y>c.height)dead=true;ctx.fillStyle='#00f2fe';ctx.beginPath();ctx.arc(70,y,14,0,6.28);ctx.fill();
        if(dead){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('КРУШЕНИЕ! Счёт: '+sc,40,c.height/2);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}

function gShooter(v){
    v.innerHTML='<div class="topbar"><span id="s">Очки: 0</span><span>Води пальцем — автоогонь</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let px=c.width/2,lasers=[],enemies=[],fr=0,sc=0,dead=false;
    c.ontouchmove=e=>{e.preventDefault();let t=e.touches.item(0);if(t)px=t.clientX;};
    function loop(){
        if(dead)return;fr++;ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);
        if(fr%12===0)lasers.push({x:px,y:c.height-70});
        if(fr%35===0)enemies.push({x:25+Math.random()*(c.width-50),y:-25,hp:2});
        lasers.forEach((l,i)=>{l.y-=10;ctx.fillStyle='#00f2fe';ctx.fillRect(l.x-2,l.y,4,14);if(l.y<0)lasers.splice(i,1);});
        enemies.forEach((en,ei)=>{
            en.y+=3+sc*0.015;ctx.fillStyle=en.hp>1?'#ff007f':'#f1c40f';ctx.fillRect(en.x-18,en.y-14,36,28);
            if(en.y>c.height-40)dead=true;
            lasers.forEach((l,li)=>{if(Math.abs(l.x-en.x)<20&&Math.abs(l.y-en.y)<16){en.hp--;lasers.splice(li,1);if(en.hp<=0){enemies.splice(ei,1);sc+=10;document.getElementById('s').innerText='Очки: '+sc;}}});
        });
        ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.moveTo(px,c.height-75);ctx.lineTo(px-18,c.height-45);ctx.lineTo(px+18,c.height-45);ctx.fill();
        if(dead){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ПРОРЫВ БАЗЫ! Счёт: '+sc,30,c.height/2);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}

function gDoodle(v){
    v.innerHTML='<div class="topbar"><span id="s">Высота: 0</span><span>Двигай пальцем влево/вправо</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let px=c.width/2,py=c.height-100,vy=-10,plats=[],sc=0;
    for(let i=0;i<8;i++)plats.push({x:Math.random()*(c.width-70),y:i*(c.height/8)});
    c.ontouchmove=e=>{e.preventDefault();let t=e.touches.item(0);if(t)px=t.clientX;};
    function loop(){
        ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);vy+=0.38;py+=vy;
        if(py<c.height*0.4){let diff=c.height*0.4-py;py=c.height*0.4;sc+=Math.floor(diff);document.getElementById('s').innerText='Высота: '+sc;plats.forEach(p=>{p.y+=diff;if(p.y>c.height){p.y=0;p.x=Math.random()*(c.width-70);}});}
        plats.forEach(p=>{ctx.fillStyle='#00f2fe';ctx.fillRect(p.x,p.y,70,10);if(vy>0&&px+12>p.x&&px-12<p.x+70&&py+14>p.y&&py+14<p.y+16)vy=-11;});
        ctx.fillStyle='#ff007f';ctx.beginPath();ctx.arc(px,py,13,0,6.28);ctx.fill();
        if(py>c.height){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ПАДЕНИЕ! Высота: '+sc,35,c.height/2);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}

function gRace(v){
    v.innerHTML='<div class="topbar"><span id="s">Дистанция: 0 м</span><span>Свайпай полосы</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let lane=1,lanes=Array.of(c.width*0.22,c.width*0.5,c.width*0.78),cars=[],dist=0,sx=0,dead=false;
    c.ontouchstart=e=>{let t=e.touches.item(0);if(t)sx=t.clientX;};
    c.ontouchend=e=>{let t=e.changedTouches.item(0);if(!t)return;if(t.clientX-sx>25&&lane<2)lane++;if(sx-t.clientX>25&&lane>0)lane--;};
    function loop(){
        if(dead)return;ctx.fillStyle='#121426';ctx.fillRect(0,0,c.width,c.height);dist++;document.getElementById('s').innerText=`Дистанция: ${Math.floor(dist/5)} м`;
        if(dist%40===0)cars.push({l:Math.floor(Math.random()*3),y:-60,col:Array.of('#00f2fe','#f1c40f','#9b59b6').at(Math.floor(Math.random()*3))});
        cars.forEach((en,i)=>{en.y+=5.5+dist*0.004;ctx.fillStyle=en.col;ctx.fillRect(lanes.at(en.l)-18,en.y,36,60);if(en.l===lane&&en.y+58>c.height-105&&en.y<c.height-45)dead=true;if(en.y>c.height)cars.splice(i,1);});
        ctx.fillStyle='#ff007f';ctx.fillRect(lanes.at(lane)-18,c.height-105,36,60);
        if(dead){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('АВАРИЯ! Рекорд: '+Math.floor(dist/5)+' м',30,c.height/2);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}
function gSnake(v){
    v.innerHTML='<div class="topbar"><span id="s">Очки: 0</span><span>Свайпай направление</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d'),sz=20,cols=Math.floor(window.innerWidth/sz),rows=Math.floor((window.innerHeight-95)/sz);
    c.width=cols*sz;c.height=rows*sz;
    let sn=Array.of({x:8,y:10},{x:7,y:10},{x:6,y:10}),dx=1,dy=0,food={x:12,y:10},sc=0,sx=0,sy=0;
    c.ontouchstart=e=>{let t=e.touches.item(0);if(t){sx=t.clientX;sy=t.clientY;}};
    c.ontouchend=e=>{let t=e.changedTouches.item(0);if(!t)return;let vx=t.clientX-sx,vy=t.clientY-sy;if(Math.abs(vx)>Math.abs(vy)){if(vx>20&&dx===0){dx=1;dy=0;}if(vx<-20&&dx===0){dx=-1;dy=0;}}else{if(vy>20&&dy===0){dx=0;dy=1;}if(vy<-20&&dy===0){dx=0;dy=-1;}}};
    tmr=setInterval(()=>{
        let head={x:(sn.at(0).x+dx+cols)%cols,y:(sn.at(0).y+dy+rows)%rows};
        if(sn.some(s=>s.x===head.x&&s.y===head.y)){clearInterval(tmr);ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ВРЕЗАЛСЯ! Счёт: '+sc,30,c.height/2);return;}
        sn.unshift(head);if(head.x===food.x&&head.y===food.y){sc+=10;document.getElementById('s').innerText='Очки: '+sc;food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};}else sn.pop();
        ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#2ecc71';ctx.fillRect(food.x*sz+2,food.y*sz+2,sz-4,sz-4);
        sn.forEach((s,i)=>{ctx.fillStyle=i===0?'#00f2fe':'#ff007f';ctx.fillRect(s.x*sz+1,s.y*sz+1,sz-2,sz-2);});
    },115);
}

function gArkanoid(v){
    v.innerHTML='<div class="topbar"><span id="s">Блоков: 24</span><span>Двигай платформу</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let pad=c.width/2-45,b={x:c.width/2,y:c.height-60,vx:4,vy:-4.5},bl=[];
    for(let r=0;r<4;r++)for(let col=0;col<6;col++)bl.push({x:col*(c.width/6)+4,y:25+r*25,w:c.width/6-8,h:19,ok:true,col:Array.of('#ff007f','#00f2fe','#f1c40f','#9b59b6').at(r)});
    c.ontouchmove=e=>{e.preventDefault();let t=e.touches.item(0);if(t)pad=Math.max(0,Math.min(c.width-90,t.clientX-45));};
    function loop(){
        ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>c.width-8)b.vx*=-1;if(b.y<8)b.vy*=-1;
        if(b.y>c.height-35&&b.x>pad&&b.x<pad+90)b.vy=-Math.abs(b.vy);if(b.y>c.height){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ШАР УПАЛ!',40,c.height/2);return;}
        let left=0;bl.forEach(x=>{if(!x.ok)return;left++;ctx.fillStyle=x.col;ctx.fillRect(x.x,x.y,x.w,x.h);if(b.x>x.x&&b.x<x.x+x.w&&b.y>x.y&&b.y<x.y+x.h){x.ok=false;b.vy*=-1;}});
        document.getElementById('s').innerText='Блоков: '+left;ctx.fillStyle='#00f2fe';ctx.fillRect(pad,c.height-25,90,12);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,8,0,6.28);ctx.fill();
        if(left>0)raf=requestAnimationFrame(loop);
    }loop();
}

function gMines(v){
    v.innerHTML='<div class="topbar"><span id="mn">Мин: 8</span><button class="mbtn on" id="mnf">Режим: Открыть</button></div><div class="box-grid" id="mg" style="grid-template-columns:repeat(7,44px)"></div>';
    let flag=false,over=false,cells=Array(49).fill(0).map(()=>({m:false,o:false,f:false,n:0}));
    document.getElementById('mnf').onclick=function(){flag=!flag;this.innerText=flag?'Режим: 🚩 Флаг':'Режим: Открыть';};
    let p=0;while(p<8){let r=Math.floor(Math.random()*49);if(!cells.at(r).m){cells.at(r).m=true;p++;}}
    cells.forEach((c,i)=>{if(c.m)return;let x=i%7,y=Math.floor(i/7);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let nx=x+dx,ny=y+dy;if(nx>=0&&nx<7&&ny>=0&&ny<7&&cells.at(ny*7+nx).m)c.n++;}});
    const g=document.getElementById('mg');
    function draw(){g.innerHTML='';cells.forEach(c=>{const el=document.createElement('div');el.className='cell';el.style.height='44px';el.style.fontSize='16px';if(c.o){el.style.background=c.m?'#ff007f':'#0f122b';el.innerText=c.m?'💣':(c.n||'');}else if(c.f)el.innerText='🚩';el.onclick=()=>{if(over||c.o)return;if(flag){c.f=!c.f;draw();return;}if(c.f)return;c.o=true;if(c.m){over=true;cells.forEach(x=>{if(x.m)x.o=true;});document.getElementById('mn').innerText='БУМ! Мина 💥';}else if(cells.filter(x=>!x.m&&!x.o).length===0){over=true;document.getElementById('mn').innerText='ПОБЕДА! 🏆';}draw();};g.appendChild(el);});}draw();
}

function g2048(v){
    v.innerHTML='<div class="topbar"><span id="s2">Счёт: 0</span><span>Свайпай плитки</span></div><div class="box-grid" id="g2" style="grid-template-columns:repeat(4,74px)"></div>';
    let b=Array(16).fill(0),sc=0,sx=0,sy=0;
    const add=()=>{let e=b.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(e.length)b.splice(e.at(Math.floor(Math.random()*e.length)),1,Math.random()<0.9?2:4);};
    add();add();const g=document.getElementById('g2');
    function draw(){g.innerHTML='';document.getElementById('s2').innerText='Счёт: '+sc;b.forEach(val=>{const el=document.createElement('div');el.className='cell';el.style.height='74px';el.innerText=val||'';if(val)el.style.background=val>=64?'#ff007f':'#29306e';g.appendChild(el);});}
    function slide(r){let a=r.filter(x=>x);for(let i=0;i<a.length-1;i++)if(a.at(i)===a.at(i+1)){a.splice(i,1,a.at(i)*2);sc+=a.at(i);a.splice(i+1,1,0);}a=a.filter(x=>x);while(a.length<4)a.push(0);return a;}
    function move(d){let old=b.join(',');for(let i=0;i<4;i++){let r=d<2?Array.of(b.at(i*4),b.at(i*4+1),b.at(i*4+2),b.at(i*4+3)):Array.of(b.at(i),b.at(i+4),b.at(i+8),b.at(i+12));if(d%2===1)r.reverse();r=slide(r);if(d%2===1)r.reverse();for(let j=0;j<4;j++)if(d<2)b.splice(i*4+j,1,r.at(j));else b.splice(i+j*4,1,r.at(j));}if(old!==b.join(',')){add();draw();}}
    v.ontouchstart=e=>{let t=e.touches.item(0);if(t){sx=t.clientX;sy=t.clientY;}};
    v.ontouchend=e=>{let t=e.changedTouches.item(0);if(!t)return;let dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);};
    draw();
}

function gHockey(v){
    let bot=false,s1=0,s2=0;
    v.innerHTML='<div class="topbar"><span id="hk">0 : 0</span><button class="mbtn on" id="hkb">Режим: 1×1</button></div><canvas id="cv"></canvas>';
    document.getElementById('hkb').onclick=function(){bot=!bot;this.innerText=bot?'Режим: Бот':'Режим: 1×1';};
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let pk={x:c.width/2,y:c.height/2,vx:4,vy:5},p1=c.width/2,p2=c.width/2;
    c.ontouchmove=e=>{e.preventDefault();for(let i=0;i<e.touches.length;i++){let t=e.touches.item(i);if(t.clientY-95>c.height/2)p1=t.clientX;else if(!bot)p2=t.clientX;}};
    function loop(){
        ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#242a56';ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();
        if(bot)p2+=(pk.x-p2)*0.08;pk.x+=pk.vx;pk.y+=pk.vy;if(pk.x<12||pk.x>c.width-12)pk.vx*=-1;
        if(pk.y<38&&Math.abs(pk.x-p2)<52)pk.vy=Math.abs(pk.vy)+0.2;if(pk.y>c.height-38&&Math.abs(pk.x-p1)<52)pk.vy=-Math.abs(pk.vy)-0.2;
        if(pk.y<0){s1++;pk={x:c.width/2,y:c.height/2,vx:4,vy:4.5};}if(pk.y>c.height){s2++;pk={x:c.width/2,y:c.height/2,vx:-4,vy:-4.5};}
        document.getElementById('hk').innerText=`Синий ${s2} : ${s1} Розовый`;
        ctx.fillStyle='#00f2fe';ctx.fillRect(p2-48,22,96,12);ctx.fillStyle='#ff007f';ctx.fillRect(p1-48,c.height-34,96,12);
        ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(pk.x,pk.y,12,0,6.28);ctx.fill();raf=requestAnimationFrame(loop);
    }loop();
}
function gTanks(v){
    v.innerHTML='<div class="topbar"><span id="tk">Жми на свою половину для выстрела!</span></div><canvas id="cv"></canvas>';
    const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let t1={x:c.width/2,y:c.height-45,d:1,hp:3},t2={x:c.width/2,y:45,d:-1,hp:3},sh=[],w={x:c.width/2-50,y:c.height/2-10,w:100,h:20,dx:2.2};
    c.ontouchstart=e=>{e.preventDefault();let t=e.touches.item(0);if(!t)return;let low=t.clientY-95>c.height/2;sh.push({x:low?t1.x:t2.x,y:low?t1.y-22:t2.y+22,vy:low?-8:8,o:low?1:2});};
    function loop(){
        ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);
        Array.of(t1,t2).forEach((t,i)=>{t.x+=t.d*2.8;if(t.x<30||t.x>c.width-30)t.d*=-1;ctx.fillStyle=i===0?'#ff007f':'#00f2fe';ctx.fillRect(t.x-20,t.y-14,40,28);});
        w.x+=w.dx;if(w.x<10||w.x+w.w>c.width-10)w.dx*=-1;ctx.fillStyle='#f1c40f';ctx.fillRect(w.x,w.y,w.w,w.h);
        sh.forEach((s,i)=>{s.y+=s.vy;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,5,0,6.28);ctx.fill();if(s.x>w.x&&s.x<w.x+w.w&&s.y>w.y&&s.y<w.y+w.h){sh.splice(i,1);return;}if(s.o===1&&Math.hypot(s.x-t2.x,s.y-t2.y)<22){t2.hp--;sh.splice(i,1);}if(s.o===2&&Math.hypot(s.x-t1.x,s.y-t1.y)<22){t1.hp--;sh.splice(i,1);}});
        document.getElementById('tk').innerText=`Синий: ${'❤️'.repeat(Math.max(0,t2.hp))} | Розовый: ${'❤️'.repeat(Math.max(0,t1.hp))}`;
        if(t1.hp<=0||t2.hp<=0){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText(t1.hp>0?'ПОБЕДА РОЗОВОГО! 🏆':'ПОБЕДА СИНЕГО! 🏆',40,c.height/2);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}

function gDuel(v){
    let s1=0,s2=0;
    const rnd=()=>{let go=false,end=false;v.innerHTML=`<div class="half rot" id="d2">Счёт: ${s2}<br>ЖДИ...</div><div class="half norm" id="d1">Счёт: ${s1}<br>ЖДИ...</div>`;tmr=setTimeout(()=>{go=true;Array.of('d1','d2').forEach(i=>{let e=document.getElementById(i);if(e){e.style.background='#2ecc71';e.style.color='#000';e.innerText='ОГОНЬ! ЖМИ!';}});},1500+Math.random()*2500);const fire=p=>{if(end)return;end=true;clearTimeout(tmr);let w=go?p:(p===1?2:1);if(w===1)s1++;else s2++;document.getElementById('d1').innerText=w===1?'ПОБЕДА! 🏆':'ПРОИГРАЛ 💀';document.getElementById('d2').innerText=w===2?'ПОБЕДА! 🏆':'ПРОИГРАЛ 💀';tmr=setTimeout(rnd,1600);};document.getElementById('d1').ontouchstart=e=>{e.preventDefault();fire(1);};document.getElementById('d2').ontouchstart=e=>{e.preventDefault();fire(2);};};rnd();
}

function gTug(v){
    let p=50,end=false;v.innerHTML='<div class="half rot" id="t2">ЖМИ БЫСТРЕЕ!</div><div class="half norm" id="t1">ЖМИ БЫСТРЕЕ!</div>';
    const hit=pl=>{if(end)return;p+=(pl===1?4:-4);document.getElementById('t1').style.flex=p;document.getElementById('t2').style.flex=100-p;if(p>=92||p<=8){end=true;document.getElementById('t1').innerText=p>=92?'ПОБЕДА 🏆':'ПРОИГРЫШ';document.getElementById('t2').innerText=p<=8?'ПОБЕДА 🏆':'ПРОИГРЫШ';}};
    document.getElementById('t1').ontouchstart=e=>{e.preventDefault();hit(1);};document.getElementById('t2').ontouchstart=e=>{e.preventDefault();hit(2);};
}

function gTTT(v){
    v.innerHTML='<div class="panel"><h3>Выбери режим</h3><button class="abtn" id="ai">Против Бота (ИИ)</button><button class="abtn" style="background:#ff007f;color:#fff" id="p2">На двоих (1×1)</button></div>';
    const st=ai=>{let b=Array(9).fill(''),t='❌',end=false,lines='012,345,678,036,147,258,048,246'.split(',');v.innerHTML='<div id="ts" style="text-align:center;padding:15px;font-weight:bold">Ход: ❌</div><div class="box-grid" id="tg" style="grid-template-columns:repeat(3,90px)"></div>';const g=document.getElementById('tg'),cells=[];const mv=i=>{if(end||b.at(i))return;b.splice(i,1,t);cells.at(i).innerText=t;if(lines.some(l=>b.at(l.at(0))===t&&b.at(l.at(1))===t&&b.at(l.at(2))===t)){document.getElementById('ts').innerText='ПОБЕДИЛ '+t+' 🏆';end=true;return;}if(!b.includes('')){document.getElementById('ts').innerText='НИЧЬЯ 🤝';end=true;return;}t=t==='❌'?'⭕':'❌';document.getElementById('ts').innerText='Ход: '+t;if(ai&&t==='⭕'&&!end){let em=b.map((x,k)=>x===''?k:-1).filter(x=>x>=0);setTimeout(()=>mv(em.at(Math.floor(Math.random()*em.length))),250);}};for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.style.height='90px';c.style.fontSize='38px';c.onclick=()=>mv(i);g.appendChild(c);cells.push(c);}};
    document.getElementById('ai').onclick=()=>st(true);document.getElementById('p2').onclick=()=>st(false);
}

function gMath(v){
    let s1=0,s2=0,ans=0;v.innerHTML='<div class="half rot"><div id="q2" style="font-size:24px;font-weight:900;margin-bottom:10px"></div><div id="b2" style="display:flex;gap:8px"></div><div id="s2">0</div></div><div class="half norm"><div id="q1" style="font-size:24px;font-weight:900;margin-bottom:10px"></div><div id="b1" style="display:flex;gap:8px"></div><div id="s1">0</div></div>';
    function nxt(){let a=3+Math.floor(Math.random()*12),b=2+Math.floor(Math.random()*12);ans=a*b;let opts=Array.of(ans,ans+4,ans-3).sort(()=>Math.random()-0.5);Array.of('q1','q2').forEach(i=>document.getElementById(i).innerText=`${a} × ${b} = ?`);Array.of(1,2).forEach(p=>{const box=document.getElementById('b'+p);box.innerHTML='';opts.forEach(o=>{const btn=document.createElement('button');btn.className='mbtn';btn.style.fontSize='18px';btn.style.padding='10px 18px';btn.innerText=o;btn.onclick=()=>{if(o===ans){p===1?s1++:s2++;document.getElementById('s1').innerText=s1;document.getElementById('s2').innerText=s2;nxt();}};box.appendChild(btn);});});}nxt();
}

    document.getElementById('sb').onclick=function(){if(!vis){vis=true;document.getElementById('sp').innerText=cur===spy?'🤫 ТЫ ШПИОН! Угадай локацию':'📍 Локация: '+loc;this.innerText='СКРЫТЬ';}else{cur++;vis=false;if(cur>=pl){document.getElementById('sp').innerText='Все роли розданы! Задавайте вопросы.';this.style.display='none';}else{document.getElementById('sp').innerText='Передай Игроку '+(cur+1);this.innerText='ПОКАЗАТЬ РОЛЬ';}}};
