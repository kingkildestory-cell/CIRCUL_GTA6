function renderCatalog(){
    const box=document.getElementById('catalog');box.innerHTML='';
    GAMES.filter(g=>activeTab==='all'||g.cat===activeTab).forEach(g=>{
        const el=document.createElement('div');el.className='card';
        el.innerHTML=`<div><div class="c-top"><span class="c-ico">${g.ico}</span><span class="badge b-${g.cat}">${g.badge}</span></div><h3>${g.name}</h3></div><p>${g.desc}</p>`;
        el.onclick=()=>openGame(g);box.appendChild(el);
    });
}
function filterGames(cat,el){
    activeTab=cat;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');renderCatalog();
}
function exitGame(){
    cancelAnimationFrame(raf);clearInterval(tmr);clearTimeout(tmr);
    document.getElementById('game-view').style.display='none';
    document.getElementById('catalog').style.display='grid';
    document.getElementById('tabs').style.display='flex';
    document.getElementById('btn-back').style.display='none';
    document.getElementById('main-title').innerText='MEGA ARCADE • 24 ИГРЫ';
}
function openGame(g){
    document.getElementById('catalog').style.display='none';
    document.getElementById('tabs').style.display='none';
    document.getElementById('btn-back').style.display='block';
    document.getElementById('main-title').innerText=g.ico+' '+g.name;
    const v=document.getElementById('game-view');v.style.display='flex';v.innerHTML='';
    const map={hockey:initHockey,tanks:initTanks,math:initMath,duel:initDuel,memory:initMemory,ttt:initTTT,race:initRace,snake:initSnake,arkanoid:initArkanoid,mines:initMines,g2048:init2048,battleship:initShip,flappy:initFlappy,shooter:initShooter,jumper:initJumper,simon:initSimon,whack:initWhack,stroop:initStroop,stack:initStack,slice:initSlice,tycoon:initTycoon,bulls:initBulls,spy:initSpy,mafia:initMafia};
    if(map[g.id])map[g.id](v);
}

function initHockey(v){
    let vsBot=false;
    v.innerHTML=`<div class="top-bar"><span id="hk-sc">Синий 0 : 0 Розовый</span><div class="mode-switch"><button class="m-btn on" id="m-2p">1×1</button><button class="m-btn" id="m-ai">Бот</button></div></div><canvas id="c-hk"></canvas>`;
    document.getElementById('m-2p').onclick=function(){vsBot=false;this.classList.add('on');document.getElementById('m-ai').classList.remove('on');};
    document.getElementById('m-ai').onclick=function(){vsBot=true;this.classList.add('on');document.getElementById('m-2p').classList.remove('on');};
    const c=document.getElementById('c-hk'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let s1=0,s2=0,pk={x:c.width/2,y:c.height/2,vx:4,vy:5,r:14},p1={x:c.width/2,y:c.height-70,r:26},p2={x:c.width/2,y:70,r:26};
    c.ontouchmove=e=>{e.preventDefault();for(let i=0;i<e.touches.length;i++){let t=e.touches.item(i),y=t.clientY-95;if(y>c.height/2){p1.x=t.clientX;p1.y=Math.max(c.height/2+26,y);}else if(!vsBot){p2.x=t.clientX;p2.y=Math.min(c.height/2-26,y);}}};
    function loop(){
        ctx.fillStyle='#0a0c1d';ctx.fillRect(0,0,c.width,c.height);
        ctx.strokeStyle='#242a56';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();
        ctx.fillStyle='#00f2fe';ctx.fillRect(c.width/2-65,0,130,8);ctx.fillStyle='#ff007f';ctx.fillRect(c.width/2-65,c.height-8,130,8);
        if(vsBot){p2.x+=(pk.x-p2.x)*0.08;p2.y=70;}
        pk.x+=pk.vx;pk.y+=pk.vy;pk.vx*=0.995;pk.vy*=0.995;
        if(pk.x<pk.r){pk.x=pk.r;pk.vx*=-1;}if(pk.x>c.width-pk.r){pk.x=c.width-pk.r;pk.vx*=-1;}
        if(pk.y<0){if(Math.abs(pk.x-c.width/2)<65){s1++;pk={x:c.width/2,y:c.height/2,vx:3,vy:4,r:14};}else{pk.y=0;pk.vy*=-1;}}
        if(pk.y>c.height){if(Math.abs(pk.x-c.width/2)<65){s2++;pk={x:c.width/2,y:c.height/2,vx:-3,vy:-4,r:14};}else{pk.y=c.height;pk.vy*=-1;}}
        [p1,p2].forEach(p=>{let d=Math.hypot(pk.x-p.x,pk.y-p.y);if(d<pk.r+p.r){let a=Math.atan2(pk.y-p.y,pk.x-p.x);pk.vx=Math.cos(a)*10;pk.vy=Math.sin(a)*10;}});
        document.getElementById('hk-sc').innerText=`Синий ${s2} : ${s1} Розовый`;
        ctx.fillStyle='#ff007f';ctx.beginPath();ctx.arc(p1.x,p1.y,p1.r,0,6.28);ctx.fill();
        ctx.fillStyle='#00f2fe';ctx.beginPath();ctx.arc(p2.x,p2.y,p2.r,0,6.28);ctx.fill();
        ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(pk.x,pk.y,pk.r,0,6.28);ctx.fill();
        raf=requestAnimationFrame(loop);
    }loop();
}

function initTanks(v){
    v.innerHTML=`<div class="top-bar"><span id="tk-info">Жми на свою половину для выстрела!</span></div><canvas id="c-tk"></canvas>`;
    const c=document.getElementById('c-tk'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let t1={x:c.width/2,y:c.height-45,dir:1,hp:3},t2={x:c.width/2,y:45,dir:-1,hp:3},shells=[],w={x:c.width/2-50,y:c.height/2-10,w:100,h:20,dx:2.2};
    c.ontouchstart=e=>{e.preventDefault();let t=e.touches.item(0);if(!t)return;if(t.clientY-95>c.height/2)shells.push({x:t1.x,y:t1.y-25,vy:-8,own:1});else shells.push({x:t2.x,y:t2.y+25,vy:8,own:2});};
    function loop(){
        ctx.fillStyle='#0d1021';ctx.fillRect(0,0,c.width,c.height);
        [t1,t2].forEach((t,i)=>{t.x+=t.dir*(2.5+i*0.5);if(t.x<30||t.x>c.width-30)t.dir*=-1;ctx.fillStyle=i===0?'#ff007f':'#00f2fe';ctx.fillRect(t.x-20,t.y-15,40,30);ctx.fillRect(t.x-4,i===0?t.y-26:t.y+15,8,12);});
        w.x+=w.dx;if(w.x<10||w.x+w.w>c.width-10)w.dx*=-1;ctx.fillStyle='#f1c40f';ctx.fillRect(w.x,w.y,w.w,w.h);
        shells.forEach((s,i)=>{
            s.y+=s.vy;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,5,0,6.28);ctx.fill();
            if(s.x>w.x&&s.x<w.x+w.w&&s.y>w.y&&s.y<w.y+w.h){shells.splice(i,1);return;}
            if(s.own===1&&Math.hypot(s.x-t2.x,s.y-t2.y)<22){t2.hp--;shells.splice(i,1);}
            if(s.own===2&&Math.hypot(s.x-t1.x,s.y-t1.y)<22){t1.hp--;shells.splice(i,1);}
            if(s.y<0||s.y>c.height)shells.splice(i,1);
        });
        document.getElementById('tk-info').innerText=`Синий: ${'❤️'.repeat(Math.max(0,t2.hp))} | Розовый: ${'❤️'.repeat(Math.max(0,t1.hp))}`;
        if(t1.hp<=0||t2.hp<=0){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText(t1.hp>0?'ПОБЕДИЛ РОЗОВЫЙ! 🏆':'ПОБЕДИЛ СИНИЙ! 🏆',35,c.height/2);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}

function initMath(v){
    let s1=0,s2=0,ans=0;
    v.innerHTML=`<div class="split-half p2-rot"><div id="m-q2" style="font-size:24px;font-weight:900;margin-bottom:12px"></div><div id="m-b2" style="display:flex;gap:10px"></div><div id="m-s2" style="margin-top:8px;font-size:13px">Очки: 0</div></div>
                 <div class="split-half p1-norm"><div id="m-q1" style="font-size:24px;font-weight:900;margin-bottom:12px"></div><div id="m-b1" style="display:flex;gap:10px"></div><div id="m-s1" style="margin-top:8px;font-size:13px">Очки: 0</div></div>`;
    function next(){
        let a=3+Math.floor(Math.random()*12),b=2+Math.floor(Math.random()*12);ans=a*b;
        let opts=[ans,ans+4,ans-3].sort(()=>Math.random()-0.5);
        ['m-q1','m-q2'].forEach(id=>document.getElementById(id).innerText=`${a} × ${b} = ?`);
       .forEach(p=>{
            const box=document.getElementById('m-b'+p);box.innerHTML='';
            opts.forEach(o=>{
                const btn=document.createElement('button');btn.className='m-btn';btn.style.fontSize='18px';btn.style.padding='10px 18px';btn.innerText=o;
                btn.onclick=()=>{if(o===ans){if(p===1)s1++;else s2++;document.getElementById('m-s1').innerText='Очки: '+s1;document.getElementById('m-s2').innerText='Очки: '+s2;next();}};
                box.appendChild(btn);
            });
        });

function initArkanoid(v){

    const c=document.getElementById('c-ar'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let pad={x:c.width/2-45,w:90},ball={x:c.width/2,y:c.height-60,vx:4,vy:-4.5,r:8},blocks=[];
    for(let r=0;r<4;r++)for(let col=0;col<6;col++)blocks.push({x:col*(c.width/6)+4,y:30+r*26,w:c.width/6-8,h:20,alive:true,col:['#ff007f','#00f2fe','#f1c40f','#9b59b6'].at(r)});
    c.ontouchmove=e=>{e.preventDefault();let t=e.touches.item(0);if(t)pad.x=Math.max(0,Math.min(c.width-pad.w,t.clientX-pad.w/2));};
    function loop(){
        ctx.fillStyle='#0a0c1d';ctx.fillRect(0,0,c.width,c.height);
        ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>c.width-8)ball.vx*=-1;if(ball.y<8)ball.vy*=-1;
        if(ball.y>c.height-35&&ball.x>pad.x&&ball.x<pad.x+pad.w)ball.vy=-Math.abs(ball.vy);
        if(ball.y>c.height){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ШАР УПАЛ!',40,c.height/2);return;}
        let left=0;blocks.forEach(b=>{if(!b.alive)return;left++;ctx.fillStyle=b.col;ctx.fillRect(b.x,b.y,b.w,b.h);if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.alive=false;ball.vy*=-1;}});
        document.getElementById('ar-sc').innerText='Блоков: '+left;
        if(left===0){ctx.fillStyle='#2ecc71';ctx.font='bold 24px sans-serif';ctx.fillText('ВСЕ БЛОКИ СБИТЫ! 🏆',30,c.height/2);return;}
        ctx.fillStyle='#00f2fe';ctx.fillRect(pad.x,c.height-25,pad.w,12);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,6.28);ctx.fill();
        raf=requestAnimationFrame(loop);
    }loop();
}

    let b=Array(16).fill(0),sc=0,sx=0,sy=0;
    const add=()=>{let e=b.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(e.length)b.splice(e.at(Math.floor(Math.random()*e.length)),1,Math.random()<0.9?2:4);};
    add();add();const g=document.getElementById('g-2048');
    function draw(){g.innerHTML='';document.getElementById('sc-2048').innerText='Счёт: '+sc;b.forEach(val=>{const el=document.createElement('div');el.className='g-cell';el.style.height='74px';el.innerText=val||'';if(val)el.style.background=val>=64?'#ff007f':'#29306e';g.appendChild(el);});}
    function slide(row){let a=row.filter(x=>x);for(let i=0;i<a.length-1;i++)if(a.at(i)===a.at(i+1)){a.splice(i,1,a.at(i)*2);sc+=a.at(i);a.splice(i+1,1,0);}a=a.filter(x=>x);while(a.length<4)a.push(0);return a;}
    function move(dir){let old=b.join(',');for(let i=0;i<4;i++){let r=dir<2?[b.at(i*4),b.at(i*4+1),b.at(i*4+2),b.at(i*4+3)]:[b.at(i),b.at(i+4),b.at(i+8),b.at(i+12)];if(dir%2===1)r.reverse();r=slide(r);if(dir%2===1)r.reverse();for(let j=0;j<4;j++)if(dir<2)b.splice(i*4+j,1,r.at(j));else b.splice(i+j*4,1,r.at(j));}if(old!==b.join(',')){add();draw();}}
    v.ontouchstart=e=>{let t=e.touches.item(0);if(t){sx=t.clientX;sy=t.clientY;}};
    v.ontouchend=e=>{let t=e.changedTouches.item(0);if(!t)return;let dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);};
    draw();
}

    let seq=[],step=0,lock=true;
    cols.forEach((col,i)=>{
        const b=document.createElement('div');b.className='g-cell';b.style.height='120px';b.style.background=col;b.style.opacity='0.35';
        b.onclick=()=>{
            if(lock)return;flash(i);
            if(i===seq.at(step)){step++;if(step===seq.length){lock=true;setTimeout(nextLvl,700);}}
            else{document.getElementById('sm-st').innerText='ОШИБКА! Рекорд: ур. '+seq.length;lock=true;}
        };
        g.appendChild(b);btns.push(b);
    });
    function flash(i){btns.at(i).style.opacity='1';setTimeout(()=>btns.at(i).style.opacity='0.35',300);}
    function nextLvl(){
        seq.push(Math.floor(Math.random()*4));step=0;document.getElementById('sm-st').innerText='Уровень: '+seq.length;
        seq.forEach((val,idx)=>setTimeout(()=>{flash(val);if(idx===seq.length-1)setTimeout(()=>lock=false,350);},(idx+1)*550));
    }nextLvl();
}

function initWhack(v){

function initStroop(v){

function initStack(v){
    v.innerHTML='<div class="top-bar"><span id="sk-s">Этажей: 0</span><span>Тапни для сброса</span></div><canvas id="c-sk"></canvas>';
    const c=document.getElementById('c-sk'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let stack=[{x:c.width/2-70,w:140}],cur={x:0,w:140,dir:4},dead=false;
    c.ontouchstart=e=>{
        e.preventDefault();if(dead)return;
        let top=stack.at(-1),diff=cur.x-top.x,nw=cur.w-Math.abs(diff);
        if(nw<=5){dead=true;return;}
        stack.push({x:Math.max(cur.x,top.x),w:nw});if(stack.length>12)stack.shift();
        cur={x:0,w:nw,dir:4+stack.length*0.2};document.getElementById('sk-s').innerText='Этажей: '+(stack.length-1);
    };
    function loop(){
        ctx.fillStyle='#090a16';ctx.fillRect(0,0,c.width,c.height);
        cur.x+=cur.dir;if(cur.x<0||cur.x+cur.w>c.width)cur.dir*=-1;
        stack.forEach((b,i)=>{ctx.fillStyle=i%2?'#00f2fe':'#ff007f';ctx.fillRect(b.x,c.height-(i+1)*26,b.w,24);});
        if(!dead){ctx.fillStyle='#f1c40f';ctx.fillRect(cur.x,c.height-(stack.length+1)*26,cur.w,24);}
        else{ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('БАШНЯ РУХНУЛА!',60,100);return;}
        raf=requestAnimationFrame(loop);
    }loop();
}

function initSlice(v){
    v.innerHTML='<div class="top-bar"><span id="sl-s">Очки: 0</span><span>Режь фрукты свайпом</span></div><canvas id="c-sl"></canvas>';
    const c=document.getElementById('c-sl'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
    let items=[],sc=0,fr=0,dead=false;
    c.ontouchmove=e=>{
        e.preventDefault();let t=e.touches.item(0);if(!t||dead)return;
        items.forEach((it,i)=>{if(Math.hypot(t.clientX-it.x,(t.clientY-95)-it.y)<32){if(it.bomb)dead=true;else{sc+=10;items.splice(i,1);document.getElementById('sl-s').innerText='Очки: '+sc;}}});
    };
    function loop(){
        if(dead){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('БОМБА! Итог: '+sc,60,c.height/2);return;}
        ctx.fillStyle='#090a16';ctx.fillRect(0,0,c.width,c.height);fr++;
        if(fr%35===0)items.push({x:40+Math.random()*(c.width-80),y:c.height,vx:(Math.random()-0.5)*4,vy:-11-Math.random()*3,bomb:Math.random()<0.25,ico:['🍉','🍊','🍇','💎'].at(Math.floor(Math.random()*4))});
        ctx.font='32px sans-serif';
        items.forEach((it,i)=>{it.x+=it.vx;it.y+=it.vy;it.vy+=0.28;ctx.fillText(it.bomb?'💣':it.ico,it.x-16,it.y+12);if(it.y>c.height+40)items.splice(i,1);});
        raf=requestAnimationFrame(loop);
    }loop();
}
function initTycoon(v){

function initBulls(v){

            if(guess.includes(d)||guess.length>=4)return;guess+=d;document.getElementById('bl-in').innerText=guess.padEnd(4,'_');

                let bull=0,cow=0;for(let i=0;i<4;i++){if(guess.at(i)===digits.at(i))bull++;else if(digits.includes(guess.at(i)))cow++;}

function initSpy(v){

        v.innerHTML=`<div class="topbar"><span id="sc">Синий 0 : 0 Розовый</span><button class="mbtn on" id="md">${vsBot?'Режим: ИИ':'Режим: 1×1'}</button></div><canvas id="cv"></canvas>`;
        document.getElementById('md').onclick=function(){vsBot=!vsBot;this.innerText=vsBot?'Режим: ИИ':'Режим: 1×1';};
        const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
        let pk={x:c.width/2,y:c.height/2,vx:4,vy:5},p1=c.width/2,p2=c.width/2;
        c.ontouchmove=e=>{e.preventDefault();for(let i=0;i<e.touches.length;i++){let t=e.touches.item(i);if(t.clientY-95>c.height/2)p1=t.clientX;else if(!vsBot)p2=t.clientX;}};
        function loop(){
            ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);
            ctx.strokeStyle='#242a56';ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();
            if(vsBot)p2+=(pk.x-p2)*0.08;
            pk.x+=pk.vx;pk.y+=pk.vy;if(pk.x<12||pk.x>c.width-12)pk.vx*=-1;
            if(pk.y<38&&Math.abs(pk.x-p2)<55)pk.vy=Math.abs(pk.vy)+0.2;
            if(pk.y>c.height-38&&Math.abs(pk.x-p1)<55)pk.vy=-Math.abs(pk.vy)-0.2;
            if(pk.y<0){s1++;pk={x:c.width/2,y:c.height/2,vx:4,vy:4.5};}
            if(pk.y>c.height){s2++;pk={x:c.width/2,y:c.height/2,vx:-4,vy:-4.5};}
            document.getElementById('sc').innerText=`Синий ${s2} : ${s1} Розовый`;
            ctx.fillStyle='#00f2fe';ctx.fillRect(p2-48,22,96,12);ctx.fillStyle='#ff007f';ctx.fillRect(p1-48,c.height-34,96,12);
            ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(pk.x,pk.y,12,0,6.28);ctx.fill();
            raf=requestAnimationFrame(loop);
        }loop();
    }else if(g.id==='math'||g.id==='duel'){
        let s1=0,s2=0,ans=0;
        v.innerHTML=`<div class="half rot"><div id="q2" style="font-size:24px;font-weight:900;margin-bottom:10px"></div><div id="b2" style="display:flex;gap:8px"></div><div id="s2" style="margin-top:8px">Очки: 0</div></div>
                     <div class="half norm"><div id="q1" style="font-size:24px;font-weight:900;margin-bottom:10px"></div><div id="b1" style="display:flex;gap:8px"></div><div id="s1" style="margin-top:8px">Очки: 0</div></div>`;
        function nxt(){
            let a=3+Math.floor(Math.random()*12),b=2+Math.floor(Math.random()*12);ans=a*b;
            let opts=Array.of(ans,ans+4,ans-3).sort(()=>Math.random()-0.5);
            Array.of('q1','q2').forEach(id=>document.getElementById(id).innerText=`${a} × ${b} = ?`);
            Array.of(1,2).forEach(p=>{const box=document.getElementById('b'+p);box.innerHTML='';opts.forEach(o=>{const btn=document.createElement('button');btn.className='mbtn';btn.style.fontSize='18px';btn.style.padding='10px 18px';btn.innerText=o;btn.onclick=()=>{if(o===ans){p===1?s1++:s2++;document.getElementById('s1').innerText='Очки: '+s1;document.getElementById('s2').innerText='Очки: '+s2;nxt();}};box.appendChild(btn);});});
        }nxt();
    }else if(g.id==='ttt'||g.id==='memory'){
        let b=Array(9).fill(''),t='❌',end=false,lines='012,345,678,036,147,258,048,246'.split(',');
        v.innerHTML='<div id="ts" style="text-align:center;padding:15px;font-weight:bold">Ход: ❌</div><div class="box-grid" id="tg" style="grid-template-columns:repeat(3,90px)"></div>';
        const gr=document.getElementById('tg'),cells=[];
        const mv=i=>{
            if(end||b.at(i))return;b.splice(i,1,t);cells.at(i).innerText=t;
            if(lines.some(l=>b.at(l.at(0))===t&&b.at(l.at(1))===t&&b.at(l.at(2))===t)){document.getElementById('ts').innerText='ПОБЕДИЛ '+t+' 🏆';end=true;return;}
            if(!b.includes('')){document.getElementById('ts').innerText='НИЧЬЯ 🤝';end=true;return;}
            t=t==='❌'?'⭕':'❌';document.getElementById('ts').innerText='Ход: '+t;
        };
        for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.style.height='90px';c.style.fontSize='38px';c.onclick=()=>mv(i);gr.appendChild(c);cells.push(c);}
    }else if(g.cat==='solo'){
        v.innerHTML='<div class="topbar"><span id="sl-s">Очки: 0</span><span>Води пальцем влево/вправо</span></div><canvas id="cv"></canvas>';
        const c=document.getElementById('cv'),ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight-95;
        let px=c.width/2,sc=0,obs=[],dead=false;
        c.ontouchmove=e=>{e.preventDefault();let t=e.touches.item(0);if(t)px=t.clientX;};
        function loop(){
            if(dead)return;ctx.fillStyle='#090b1a';ctx.fillRect(0,0,c.width,c.height);
            if(Math.random()<0.08)obs.push({x:Math.random()*c.width,y:-20,good:Math.random()>0.65});
            obs.forEach((o,i)=>{
                o.y+=5+sc*0.03;ctx.fillStyle=o.good?'#2ecc71':'#ff007f';ctx.beginPath();ctx.arc(o.x,o.y,14,0,6.28);ctx.fill();
                if(Math.hypot(o.x-px,o.y-(c.height-65))<30){if(o.good){sc+=10;obs.splice(i,1);document.getElementById('sl-s').innerText='Очки: '+sc;}else{dead=true;ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ФИНИШ! Счёт: '+sc,45,c.height/2);}}
            });
            ctx.fillStyle='#00f2fe';ctx.beginPath();ctx.arc(px,c.height-65,16,0,6.28);ctx.fill();
            raf=requestAnimationFrame(loop);
        }loop();
    }else{
        const deck=Array.of('🔪 МАФИЯ: Ты убиваешь ночью. Не выдавай себя!','🕵️ ШПИОН: Ты не знаешь локацию. Задавай хитрые вопросы!','📍 ЛОКАЦИЯ: Школьная столовая. Вычисли шпиона!','🎲 ПРАВДА: Кому из компании ты доверяешь больше всех?','🎭 КРОКОДИЛ: Изобрази без слов «Опоздал на первый урок»');
        v.innerHTML='<div class="panel"><h3>Карта для компании</h3><p id="pt" style="margin:20px 0;font-size:18px;font-weight:bold;min-height:65px">Передай телефон игроку и нажми кнопку</p><button class="abtn" id="pb">ВЫТЯНУТЬ КАРТУ</button></div>';
        document.getElementById('pb').onclick=()=>document.getElementById('pt').innerText=deck.at(Math.floor(Math.random()*deck.length));
    }
}
renderCatalog();
</script>
</body>
</html>
