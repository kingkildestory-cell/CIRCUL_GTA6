<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>100 Games Hub</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0;padding:0}
body{background:#0b091a;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 14px;background:#151130;border-bottom:1px solid #2b2459;display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;font-weight:900;background:linear-gradient(90deg,#00f2fe,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#back{background:#ff007f;border:none;color:#fff;padding:6px 12px;border-radius:8px;font-weight:bold;font-size:12px;display:none}
#filters{display:flex;gap:6px;padding:8px 12px;background:#100d24;overflow-x:auto}
.f-btn{background:#1e1942;border:1px solid #352d70;color:#ccc;padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap}
.f-btn.active{background:#ff007f;color:#fff;border-color:#ff007f;font-weight:bold}
#grid{flex:1;overflow-y:auto;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.item{background:#181436;border:1px solid #2b2459;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.item:active{transform:scale(0.96);border-color:#00f2fe}
.tag{font-size:9px;padding:2px 6px;border-radius:4px;width:fit-content;font-weight:bold}
.t-2p{background:#ff007f;color:#fff}.t-solo{background:#00f2fe;color:#000}.t-party{background:#f1c40f;color:#000}
.item h3{font-size:13px;line-height:1.2}
#stage{display:none;flex:1;flex-direction:column;position:relative;touch-action:none}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;text-align:center;padding:12px}
.p2{transform:rotate(180deg);background:rgba(0,242,254,0.15);border-bottom:2px dashed #444}
.p1{background:rgba(255,0,127,0.15)}
#board{display:grid;gap:8px;margin:auto;padding:12px}
.cell{background:#1e1942;border:2px solid #3c337a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
#card-box{margin:auto;width:88%;text-align:center;background:#181436;padding:22px;border-radius:16px;border:2px solid #00f2fe}
#card-q{font-size:19px;font-weight:bold;min-height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.big-btn{background:linear-gradient(90deg,#ff007f,#7928ca);border:none;color:#fff;padding:14px 24px;border-radius:12px;font-size:15px;font-weight:bold;width:100%}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<header><h1 id="hdr">100 ИГР • ШКОЛЬНЫЙ ХАБ</h1><button id="back" onclick="home()">← МЕНЮ</button></header>
<div id="filters">
    <button class="f-btn active" onclick="setFilter('all',this)">Все (100)</button>
    <button class="f-btn" onclick="setFilter('2p',this)">На двоих 1×1</button>
    <button class="f-btn" onclick="setFilter('solo',this)">Соло</button>
    <button class="f-btn" onclick="setFilter('party',this)">На компанию</button>
</div>
<div id="grid"></div>
<div id="stage"></div>
<script>
if(window.Telegram&&window.Telegram.WebApp)window.Telegram.WebApp.expand();
let loopId=null,timerId=null,curFilter='all';

const titles2P=['Аэрохоккей','Пинг-Понг','Дуэль Дикий Запад','Перетягивание каната','Армрестлинг','Гонка ракет','Битва хакеров','Толкач сумо','Снайпер-дуэль','Сапёр 1×1','Крестики-нолики','Морской бой блиц','Реакция светофор','Зомби-натиск','Лазерный хоккей','Космический понг','Взлом сейфа 1×1','Битва кликов','Кто быстрее','Огненный шар','Ледокол 1×1','Танковый понг','Шайба на скорость','Футбол пальцами','Бокс на реакцию','Ниндзя-удар','Блиц-математика 1×1','Правда или ложь 1×1','Цветовой баттл','Спринт 100м'];
const titlesSolo=['Змейка Неон','Флэппи Кибер','Космо-уклонение','Ловец монет','Арканоид','Сапёр Соло','Память: Найди пару','Саймон говорит','Ударь крота','Взломщик кодов','Метеоритный дождь','Гонка по встречке','Прыжок ниндзя','Охотник на вирусы','Снайпер мишеней','Лазерный лабиринт','Поймай звезду','Кибер-раннер','Тетрис-блоки','Счёт на время','Найди лишний цвет','Тап-рекорд 10 сек','Защита базы','Космический стрелок','Побег из матрицы','Золотая лихорадка','Прыгун по платформам','Антивирус','Реакция F1','Сверхскорость','Хакер Пентагона','Ловец фруктов','Неоновый спуск','Астероиды','Битва с боссом','Клик-мастер','Шпионский шифр','Тренировка мозга','Геометрия рывка','Турбо-дрифт'];
const titlesParty=['Правда или Действие','Мафия: Раздача ролей','Крокодил (Покажи слово)','Кто я? (На лоб)','Шпион: Найди локацию','Я никогда не...','Угадай фильм по эмодзи','Столицы мира блиц','Школьные фейлы','Бункер: Карта персонажа','Алиас: Объясни слово','Фанты на перемене','Данетки (Загадки)','Ассоциации','Слова на букву','Кто из нас...','Интуиция компании','Суперсила или проклятие','Блиц-опрос 5 сек','Викторина 2026','Угадай песню по строчке','Логические ловушки','Секретный агент','Правда о друге','Челлендж на 30 сек','Битва умов','Смешные истории','Тайный Санта ролей','Киноман','Гений класса'];

const games=[];
titles2P.forEach((t,i)=>games.push({id:games.length+1,name:t,type:'2p',tag:'НА ДВОИХ',eng:i%4,seed:i}));
titlesSolo.forEach((t,i)=>games.push({id:games.length+1,name:t,type:'solo',tag:'СОЛО',eng:4+(i%3),seed:i}));
titlesParty.forEach((t,i)=>games.push({id:games.length+1,name:t,type:'party',tag:'КОМПАНИЯ',eng:7,seed:i}));

function renderGrid(){
    const g=document.getElementById('grid');g.innerHTML='';
    games.filter(x=>curFilter==='all'||x.type===curFilter).forEach(x=>{
        const d=document.createElement('div');d.className='item';
        d.innerHTML=`<span class="tag t-${x.type}">#${x.id} • ${x.tag}</span><h3>${x.name}</h3>`;
        d.onclick=()=>launch(x);g.appendChild(d);
    });
}
function setFilter(f,btn){
    curFilter=f;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');renderGrid();
}
function home(){
    cancelAnimationFrame(loopId);clearTimeout(timerId);clearInterval(timerId);
    document.getElementById('stage').style.display='none';
    document.getElementById('grid').style.display='grid';
    document.getElementById('filters').style.display='flex';
    document.getElementById('back').style.display='none';
    document.getElementById('hdr').innerText='100 ИГР • ШКОЛЬНЫЙ ХАБ';
}

function launch(g){
    document.getElementById('grid').style.display='none';
    document.getElementById('filters').style.display='none';
    document.getElementById('back').style.display='block';
    document.getElementById('hdr').innerText=`#${g.id} ${g.name}`;
    const st=document.getElementById('stage');st.style.display='flex';st.innerHTML='';

    if(g.eng===0){
        st.innerHTML='<canvas id="cv"></canvas>';
        const c=document.getElementById('cv'),ctx=c.getContext('2d');
        c.width=window.innerWidth;c.height=window.innerHeight-50;
        let s1=0,s2=0,bx=c.width/2,by=c.height/2,vx=4+(g.seed%3),vy=4.5,p1=c.width/2,p2=c.width/2;
        c.ontouchmove=e=>{e.preventDefault();for(let i=0;i<e.touches.length;i++){let t=e.touches.item(i);if(t.clientY>c.height/2)p1=t.clientX;else p2=t.clientX;}};
        const run=()=>{
            ctx.fillStyle='#0b091a';ctx.fillRect(0,0,c.width,c.height);
            ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();
            bx+=vx;by+=vy;if(bx<12||bx>c.width-12)vx*=-1;
            if(by<35&&Math.abs(bx-p2)<55)vy=Math.abs(vy)+0.3;
            if(by>c.height-35&&Math.abs(bx-p1)<55)vy=-Math.abs(vy)-0.3;
            if(by<0){s1++;bx=c.width/2;by=c.height/2;vy=4;}
            if(by>c.height){s2++;bx=c.width/2;by=c.height/2;vy=-4;}
            ctx.fillStyle='#00f2fe';ctx.fillRect(p2-45,20,90,12);
            ctx.fillStyle='#ff007f';ctx.fillRect(p1-45,c.height-32,90,12);
            ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(bx,by,11,0,6.28);ctx.fill();
            ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText(s2+' : '+s1,16,c.height/2+8);
            loopId=requestAnimationFrame(run);
        };run();
    }
    else if(g.eng===1){
        let sc=50,done=false;
        st.innerHTML='<div class="half p2" id="h2">ИГРОК 2: ЖМИ!</div><div class="half p1" id="h1">ИГРОК 1: ЖМИ!</div>';
        const upd=()=>{document.getElementById('h1').style.flex=sc;document.getElementById('h2').style.flex=100-sc;};
        const hit=p=>{if(done)return;sc+=(p===1?4:-4);upd();if(sc>=95||sc<=5){done=true;document.getElementById('h1').innerText=sc>=95?'ПОБЕДА 🏆':'ПРОИГРЫШ';document.getElementById('h2').innerText=sc<=5?'ПОБЕДА 🏆':'ПРОИГРЫШ';}};
        document.getElementById('h1').ontouchstart=e=>{e.preventDefault();hit(1);};
        document.getElementById('h2').ontouchstart=e=>{e.preventDefault();hit(2);};
    }
    else if(g.eng===2){
        let go=false,end=false;
        st.innerHTML='<div class="half p2" id="d2">ЖДИ...</div><div class="half p1" id="d1">ЖДИ...</div>';
        timerId=setTimeout(()=>{go=true;['d1','d2'].forEach(id=>{let el=document.getElementById(id);el.style.background='#2ecc71';el.innerText='ОГОНЬ! ЖМИ!';});},1500+Math.random()*2500);
        const fire=p=>{if(end)return;end=true;clearTimeout(timerId);let w=go?p:(p===1?2:1);document.getElementById('d1').innerText=w===1?(go?'ПОБЕДА! 🏆':'СОПЕРНИК ФАЛЬСТАРТ!'):'ПРОИГРАЛ 💀';document.getElementById('d2').innerText=w===2?(go?'ПОБЕДА! 🏆':'СОПЕРНИК ФАЛЬСТАРТ!'):'ПРОИГРАЛ 💀';};
        document.getElementById('d1').ontouchstart=e=>{e.preventDefault();fire(1);};
        document.getElementById('d2').ontouchstart=e=>{e.preventDefault();fire(2);};
    }
    else if(g.eng===3){
        let turn='❌',b=Array(9).fill('');
        st.innerHTML='<div id="st-txt" style="text-align:center;padding:15px;font-weight:bold">Ход: ❌</div><div id="board" style="grid-template-columns:repeat(3,90px)"></div>';
        const bd=document.getElementById('board');
        b.forEach((_,i)=>{
            const c=document.createElement('div');c.className='cell';c.style.height='90px';
            c.onclick=()=>{if(b[i])return;b[i]=turn;c.innerText=turn;turn=turn==='❌'?'⭕':'❌';document.getElementById('st-txt').innerText='Ход: '+turn;};
            bd.appendChild(c);
        });
    }
    else if(g.eng===4){
        st.innerHTML='<canvas id="cv"></canvas>';
        const c=document.getElementById('cv'),ctx=c.getContext('2d');
        c.width=window.innerWidth;c.height=window.innerHeight-50;
        let px=c.width/2,score=0,obs=[],over=false;
        c.ontouchmove=e=>{e.preventDefault();let t=e.touches.item(0);if(t)px=t.clientX;};
        const run=()=>{
            if(over)return;
            ctx.fillStyle='#0b091a';ctx.fillRect(0,0,c.width,c.height);
            if(Math.random()<0.08)obs.push({x:Math.random()*c.width,y:-20,r:14,good:Math.random()>0.65});
            obs.forEach((o,i)=>{
                o.y+=5+(score*0.05);
                ctx.fillStyle=o.good?'#2ecc71':'#ff007f';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.28);ctx.fill();
                if(Math.hypot(o.x-px,o.y-(c.height-60))<o.r+18){if(o.good){score+=10;obs.splice(i,1);}else{over=true;ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('ФИНИШ! Счёт: '+score,30,c.height/2);}}
            });
            ctx.fillStyle='#00f2fe';ctx.beginPath();ctx.arc(px,c.height-60,18,0,6.28);ctx.fill();
            ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.fillText('Счёт: '+score,16,30);
            loopId=requestAnimationFrame(run);
        };run();
    }
    else if(g.eng===5){
        let score=0,active=-1;
        st.innerHTML='<div id="sc-m" style="text-align:center;padding:15px;font-size:20px;font-weight:bold">Очки: 0</div><div id="board" style="grid-template-columns:repeat(3,90px)"></div>';
        const bd=document.getElementById('board'),cells=[];
        for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.style.height='90px';c.onclick=()=>{if(i===active){score+=10;document.getElementById('sc-m').innerText='Очки: '+score;c.innerText='💥';active=-1;}};bd.appendChild(c);cells.push(c);}
        timerId=setInterval(()=>{cells.forEach(c=>c.innerText='');active=Math.floor(Math.random()*9);cells[active].innerText='👾';},750);
    }
    else if(g.eng===6){
        let taps=0,left=10,started=false;
        st.innerHTML='<div id="card-box"><div id="card-q">Жми кнопку максимально быстро за 10 секунд!</div><button class="big-btn" id="tap-b">СТАРТ / ЖМИ!</button></div>';
        document.getElementById('tap-b').onclick=()=>{
            if(!started){started=true;timerId=setInterval(()=>{left--;if(left<=0){clearInterval(timerId);document.getElementById('tap-b').disabled=true;document.getElementById('card-q').innerText='Финиш! Результат: '+taps+' кликов!';}},1000);}
            if(left>0){taps++;document.getElementById('card-q').innerText=`Осталось: ${left} сек | Кликов: ${taps}`;}
        };
    }
    else{
        const deck=[
            'ПРАВДА: Кому из этого чата ты доверяешь больше всех?','ДЕЙСТВИЕ: Покажи 3-е фото из галереи телефона!',
            'РОЛЬ МАФИИ: Ты — Мафия! Ночью выбираешь жертву. Никому не показывай экран.','РОЛЬ: Ты — Мирный житель. Вычисли мафию!',
            'КРОКОДИЛ: Изобрази без слов «Учительница проверяет двойки»','КТО Я: Напиши на бумажке «Илон Маск» и приклей соседу на лоб.',
            'БЛИЦ 5 СЕК: Назови 3 столицы Европы за 5 секунд!','ЭМОДЗИ-ФИЛЬМ: Угадай фильм 🚢❄️💑 (Титаник)',
            'ШПИОН: Локация — «Школьная столовая». Задавайте друг другу вопросы!','Я НИКОГДА НЕ: Списывал контрольную с телефона.'
        ];
        st.innerHTML='<div id="card-box"><div id="card-q">Нажми «Следующая карта», чтобы начать!</div><button class="big-btn" id="nxt">СЛЕДУЮЩАЯ КАРТА 🎲</button></div>';
        document.getElementById('nxt').onclick=()=>{document.getElementById('card-q').innerText=deck[Math.floor(Math.random()*deck.length)];};
    }
}
renderGrid();
</script>
</body>
</html>
