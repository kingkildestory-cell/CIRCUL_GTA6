<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini GTA 2D</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; color: white; }
        canvas { display: block; }
        #hud {
            position: absolute; top: 15px; left: 15px; pointer-events: none;
            background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 10px;
            font-size: 14px;
        }
        .stars { color: #ffcc00; font-size: 18px; letter-spacing: 2px; }
        
        /* Сенсорные кнопки для телефона */
        .controls {
            position: fixed; bottom: 25px; width: 100%; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: none;
        }
        .btn-group { display: flex; gap: 12px; pointer-events: auto; }
        .btn {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.18); border: 2px solid rgba(255, 255, 255, 0.4);
            color: white; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .btn:active, .btn.active { background: rgba(255, 255, 255, 0.45); transform: scale(0.95); }
        .btn-gas { background: rgba(46, 204, 113, 0.3); border-color: #2ecc71; height: 76px; }
        .btn-brake { background: rgba(231, 76, 60, 0.3); border-color: #e74c3c; }
        .btn-drift { width: 54px; height: 54px; font-size: 13px; background: rgba(241, 196, 15, 0.3); border-color: #f1c40f; }
    </style>
</head>
<body>
<div id="hud">
    <div>Розыск: <span id="wanted" class="stars">☆☆☆☆☆</span></div>
    <div>Очки хаоса: <span id="score">0</span></div>
</div>
<canvas id="game"></canvas>

<div class="controls">
    <div class="btn-group">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn-group" style="align-items: flex-end;">
        <div class="btn btn-drift" id="btnDrift">ДРИФТ</div>
        <div class="btn btn-brake" id="btnDown">▼</div>
        <div class="btn btn-gas" id="btnUp">▲</div>
    </div>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.expand(); // Раскрываем на весь экран Telegram
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// Привязка сенсорных кнопок
function bindTouch(id, code) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('active'); };
    const end = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('active'); };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
}

bindTouch('btnLeft', 'ArrowLeft');
bindTouch('btnRight', 'ArrowRight');
bindTouch('btnUp', 'ArrowUp');
bindTouch('btnDown', 'ArrowDown');
bindTouch('btnDrift', 'Space');

let score = 0;
let wantedLevel = 0;
const skidmarks = [];

const player = {
    x: 400, y: 400, width: 22, height: 40,
    angle: 0, speed: 0, maxSpeed: 9, accel: 0.25, friction: 0.96, turnSpeed: 0.055
};

const cop = {
    x: 1200, y: 1200, width: 22, height: 40,
    angle: 0, speed: 0, maxSpeed: 7.5, active: false
};

const buildings = [
    { x: 150, y: 150, w: 180, h: 180, color: '#3b4252' },
    { x: 550, y: 150, w: 220, h: 180, color: '#434c5e' },
    { x: 150, y: 550, w: 180, h: 250, color: '#2e3440' },
    { x: 550, y: 550, w: 220, h: 250, color: '#3b4252' },
    { x: 950, y: 200, w: 250, h: 300, color: '#4c566a' }
];

const cones = [];
function spawnCones() {
    for (let i = 0; i < 25; i++) {
        cones.push({
            x: 380 + Math.random() * 500,
            y: 100 + Math.random() * 700,
            r: 7, hit: false
        });
    }
}
spawnCones();

function update() {
    if (keys['KeyW'] || keys['ArrowUp']) player.speed += player.accel;
    if (keys['KeyS'] || keys['ArrowDown']) player.speed -= player.accel * 0.7;

    let currentTurn = player.turnSpeed;
    if (keys['Space']) {
        player.speed *= 0.94;
        currentTurn *= 1.45;
        if (Math.abs(player.speed) > 2) {
            skidmarks.push({ x: player.x, y: player.y, alpha: 0.5 });
        }
    }

    player.speed = Math.max(-player.maxSpeed / 2, Math.min(player.maxSpeed, player.speed));
    player.speed *= player.friction;

    if (Math.abs(player.speed) > 0.2) {
        const dir = player.speed > 0 ? 1 : -1;
        if (keys['KeyA'] || keys['ArrowLeft']) player.angle -= currentTurn * dir;
        if (keys['KeyD'] || keys['ArrowRight']) player.angle += currentTurn * dir;
    }

    const nextX = player.x + Math.sin(player.angle) * player.speed;
    const nextY = player.y - Math.cos(player.angle) * player.speed;

    let collided = false;
    for (let b of buildings) {
        if (nextX > b.x - 15 && nextX < b.x + b.w + 15 &&
            nextY > b.y - 15 && nextY < b.y + b.h + 15) {
            collided = true;
            player.speed *= -0.5;
            break;
        }
    }
    if (!collided) {
        player.x = nextX;
        player.y = nextY;
    }

    let activeCones = 0;
    cones.forEach(c => {
        if (!c.hit) {
            activeCones++;
            if (Math.hypot(player.x - c.x, player.y - c.y) < 24) {
                c.hit = true;
                score += 100;
                wantedLevel = Math.min(5, Math.floor(score / 300) + 1);
                cop.active = true;
                document.getElementById('score').innerText = score;
                document.getElementById('wanted').innerText = '★'.repeat(wantedLevel) + '☆'.repeat(5 - wantedLevel);
            }
        }
    });
    if (activeCones === 0) spawnCones();

    if (cop.active) {
        const dx = player.x - cop.x;
        const dy = player.y - cop.y;
        cop.angle = Math.atan2(dx, -dy);
        cop.x += Math.sin(cop.angle) * (cop.maxSpeed + wantedLevel * 0.25);
        cop.y -= Math.cos(cop.angle) * (cop.maxSpeed + wantedLevel * 0.25);
    }
}

function drawCar(x, y, angle, color, isCop = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.fillRect(-11, -20, 22, 40);
    ctx.fillStyle = '#111';
    ctx.fillRect(-9, -10, 18, 8);
    if (isCop) {
        const flash = Math.floor(Date.now() / 150) % 2 === 0;
        ctx.fillStyle = flash ? '#ff0033' : '#0066ff';
        ctx.fillRect(-8, -2, 7, 4);
        ctx.fillStyle = flash ? '#0066ff' : '#ff0033';
        ctx.fillRect(1, -2, 7, 4);
    }
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

    skidmarks.forEach((s, i) => {
        ctx.fillStyle = `rgba(10, 10, 10, ${s.alpha})`;
        ctx.fillRect(s.x - 3, s.y - 3, 6, 6);
        s.alpha -= 0.002;
        if (s.alpha <= 0) skidmarks.splice(i, 1);
    });

    cones.forEach(c => {
        if (!c.hit) {
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    buildings.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 4;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
    });

    drawCar(player.x, player.y, player.angle, '#e63946');
    if (cop.active) drawCar(cop.x, cop.y, cop.angle, '#ffffff', true);

    ctx.restore();
    requestAnimationFrame(() => { update(); draw(); });
}

draw();
</script>
</body>
</html>
