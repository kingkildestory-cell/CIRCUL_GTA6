<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vice City 3D</title>
    <script src="https://telegram.org"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; }
        body { overflow: hidden; background: #120428; font-family: sans-serif; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud { position: fixed; top: 12px; right: 16px; text-align: right; pointer-events: none; text-shadow: 2px 2px 0 #000; z-index: 10; }
        #money { color: #2ecc71; font-size: 22px; font-weight: 900; }
        #mode-hint { position: fixed; top: 12px; left: 16px; background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px; font-size: 12px; border-left: 3px solid #ff007f; pointer-events: none; z-index: 10; }
        #joystick-zone { position: fixed; bottom: 25px; left: 25px; width: 120px; height: 120px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,0,127,0.5); border-radius: 50%; z-index: 20; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 46px; height: 46px; background: linear-gradient(135deg, #ff007f, #7928ca); border-radius: 50%; pointer-events: none; }
        #actions { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; z-index: 20; }
        .btn { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(0,0,0,0.55); color: white; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .btn:active { transform: scale(0.92); background: rgba(255,0,127,0.6); }
        #btn-car { border-color: #00f2fe; color: #00f2fe; display: none; }
        #btn-jump { border-color: #f1c40f; }
    </style>
</head>
<body>
<div id="mode-hint">Поверните экран горизонтально.<br>Свайп по экрану — вращать камеру.</div>
<div id="hud"><div id="money">$00000500</div></div>
<div id="joystick-zone"><div id="joystick-stick"></div></div>
<div id="actions">
    <div class="btn" id="btn-car">СЕСТЬ<br>В АВТО</div>
    <div class="btn" id="btn-jump">ПРЫЖОК<br>/ ТОРМОЗ</div>
</div>
<script>
if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1f0933);
scene.fog = new THREE.FogExp2(0x2d0b44, 0.0085);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xff88cc, 0.7));
const dirLight = new THREE.DirectionalLight(0xffaa55, 1.1);
dirLight.position.set(60, 100, 40);
scene.add(dirLight);
const colliders = [];
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x222228 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x141417 });
for (let i = -120; i <= 120; i += 40) {
    const rH = new THREE.Mesh(new THREE.PlaneGeometry(300, 10), roadMat);
    rH.rotation.x = -Math.PI / 2; rH.position.set(0, 0.02, i); scene.add(rH);
    const rV = new THREE.Mesh(new THREE.PlaneGeometry(10, 300), roadMat);
    rV.rotation.x = -Math.PI / 2; rV.position.set(i, 0.02, 0); scene.add(rV);
}

const neonColors = [0xff007f, 0x00f2fe, 0x9b59b6, 0xf1c40f, 0x2ecc71];
for (let bx = -100; bx <= 100; bx += 40) {
    for (let bz = -100; bz <= 100; bz += 40) {
        if (Math.abs(bx) < 25 && Math.abs(bz) < 25) continue;
        const h = 12 + Math.random() * 26;
        const b = new THREE.Mesh(new THREE.BoxGeometry(22, h, 22), new THREE.MeshStandardMaterial({ color: 0x2c2c3e }));
        b.position.set(bx + 20, h / 2, bz + 20); scene.add(b);
        const trim = new THREE.Mesh(new THREE.BoxGeometry(22.4, 0.5, 22.4), new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random() * 5)] }));
        trim.position.set(bx + 20, h - 0.5, bz + 20); scene.add(trim);
        colliders.push({ minX: bx + 8, maxX: bx + 32, minZ: bz + 8, maxZ: bz + 32 });
    }
}

const pickups = [];
for (let i = 0; i < 20; i++) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1, 0.5, 1.5), new THREE.MeshBasicMaterial({ color: 0x2ecc71 }));
    p.position.set((Math.random() - 0.5) * 180, 0.8, (Math.random() - 0.5) * 180);
    scene.add(p); pickups.push(p);
}

const playerGroup = new THREE.Group();
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), new THREE.MeshStandardMaterial({ color: 0xff007f }));
torso.position.y = 1.4;
const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
head.position.y = 2.35;
const legL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.4), new THREE.MeshStandardMaterial({ color: 0x2980b9 }));
legL.position.set(-0.22, 0.45, 0);
const legR = legL.clone(); legR.position.set(0.22, 0.45, 0);
playerGroup.add(torso, head, legL, legR);
playerGroup.position.set(0, 0, 5);
scene.add(playerGroup);

const cars = [];
function createCar(x, z, color) {
    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.4), new THREE.MeshStandardMaterial({ color: color }));
    body.position.y = 0.7;
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.65, 2.2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    cabin.position.set(0, 1.35, -0.2);
    car.add(body, cabin);
    car.position.set(x, 0, z);
    car.userData = { speed: 0, angle: 0 };
    scene.add(car); cars.push(car);
}
createCar(6, 0, 0x00f2fe);
createCar(-12, -15, 0xf1c40f);
createCar(20, 25, 0xe74c3c);
let money = 500, inCar = null, playerVelY = 0, isGrounded = true, walkCycle = 0;
let joyX = 0, joyY = 0, camYaw = 0, camPitch = 0.35, lastTouchX = 0, lastTouchY = 0, braking = false;

const joyZone = document.getElementById('joystick-zone');
const joyStick = document.getElementById('joystick-stick');
joyZone.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.targetTouches, r = joyZone.getBoundingClientRect();
    let dx = t.clientX - (r.left + 60), dy = t.clientY - (r.top + 60);
    const dist = Math.min(40, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    joyX = (Math.cos(a) * dist) / 40; joyY = (Math.sin(a) * dist) / 40;
    joyStick.style.transform = `translate(${Math.cos(a) * dist}px, ${Math.sin(a) * dist}px)`;
}, { passive: false });
const resetJoy = () => { joyX = 0; joyY = 0; joyStick.style.transform = 'translate(0,0)'; };
joyZone.addEventListener('touchend', resetJoy);

renderer.domElement.addEventListener('touchstart', (e) => { lastTouchX = e.touches.clientX; lastTouchY = e.touches.clientY; });
renderer.domElement.addEventListener('touchmove', (e) => {
    camYaw -= (e.touches.clientX - lastTouchX) * 0.008;
    camPitch = Math.max(0.1, Math.min(1.1, camPitch + (e.touches.clientY - lastTouchY) * 0.006));
    lastTouchX = e.touches.clientX; lastTouchY = e.touches.clientY;
});

const btnCar = document.getElementById('btn-car');
btnCar.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (inCar) {
        playerGroup.visible = true;
        playerGroup.position.set(inCar.position.x - 2.5, 0, inCar.position.z);
        inCar = null; btnCar.innerHTML = 'СЕСТЬ<br>В АВТО';
    } else {
        for (let c of cars) {
            if (playerGroup.position.distanceTo(c.position) < 4.5) {
                inCar = c; playerGroup.visible = false; btnCar.innerHTML = 'ВЫЙТИ<br>ИЗ АВТО'; break;
            }
        }
    }
});

const btnJump = document.getElementById('btn-jump');
btnJump.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (inCar) braking = true;
    else if (isGrounded) { playerVelY = 0.28; isGrounded = false; }
});
btnJump.addEventListener('touchend', () => braking = false);

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function hitWall(x, z, r) {
    return colliders.some(b => x + r > b.minX && x - r < b.maxX && z + r > b.minZ && z - r < b.maxZ);
}

function animate() {
    requestAnimationFrame(animate);
    let target;
    if (!inCar) {
        const mag = Math.hypot(joyX, joyY);
        if (mag > 0.1) {
            const ang = Math.atan2(joyX, joyY) + camYaw;
            playerGroup.rotation.y = ang;
            const nx = playerGroup.position.x + Math.sin(ang) * 0.18 * mag;
            const nz = playerGroup.position.z + Math.cos(ang) * 0.18 * mag;
            if (!hitWall(nx, nz, 0.7)) { playerGroup.position.x = nx; playerGroup.position.z = nz; }
            walkCycle += 0.25; legL.rotation.x = Math.sin(walkCycle) * 0.6; legR.rotation.x = -Math.sin(walkCycle) * 0.6;
        } else { legL.rotation.x = 0; legR.rotation.x = 0; }
        playerGroup.position.y += playerVelY;
        if (playerGroup.position.y > 0) playerVelY -= 0.015; else { playerGroup.position.y = 0; playerVelY = 0; isGrounded = true; }
        btnCar.style.display = cars.some(c => playerGroup.position.distanceTo(c.position) < 4.5) ? 'flex' : 'none';
        target = playerGroup.position;
    } else {
        btnCar.style.display = 'flex';
        const d = inCar.userData;
        if (joyY < -0.1) d.speed += 0.025 * (-joyY);
        if (joyY > 0.1) d.speed -= 0.02 * joyY;
        if (braking) d.speed *= 0.88;
        d.speed = Math.max(-0.3, Math.min(0.85, d.speed)) * 0.97;
        if (Math.abs(d.speed) > 0.02) d.angle -= joyX * 0.045 * (d.speed > 0 ? 1 : -1);
        inCar.rotation.y = d.angle;
        const nx = inCar.position.x + Math.sin(d.angle) * d.speed;
        const nz = inCar.position.z + Math.cos(d.angle) * d.speed;
        if (!hitWall(nx, nz, 1.8)) { inCar.position.x = nx; inCar.position.z = nz; } else d.speed *= -0.4;
        if (Math.abs(joyX) > 0.1) camYaw -= joyX * 0.02;
        target = inCar.position;
    }
    pickups.forEach(p => {
        if (p.visible) {
            p.rotation.y += 0.05;
            if (target.distanceTo(p.position) < 2.5) {
                p.visible = false; money += 250;
                document.getElementById('money').innerText = '$' + String(money).padStart(8, '0');
            }
        }
    });
    const dist = inCar ? 11 : 7;
    camera.position.set(target.x - Math.sin(camYaw) * Math.cos(camPitch) * dist, target.y + Math.sin(camPitch) * dist + 1.5, target.z - Math.cos(camYaw) * Math.cos(camPitch) * dist);
    camera.lookAt(target.x, target.y + 1.5, target.z);
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
