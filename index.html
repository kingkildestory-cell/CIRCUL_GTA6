<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Face Scan</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #090b1a; color: #fff; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 22px; font-weight: 900; color: #ff007f; text-align: center; margin-bottom: 12px; }
    .card { background: #14172b; border: 1px solid #262b4d; border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; margin-bottom: 14px; }
    .avatar-box { position: relative; width: 180px; height: 180px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid #ff007f; overflow: hidden; background: #0d1021; display: flex; align-items: center; justify-content: center; }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .laser { position: absolute; left: 0; top: 0; width: 100%; height: 3px; background: #00f2fe; box-shadow: 0 0 15px #00f2fe; display: none; animation: scan 1.4s infinite; }
    @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 98%; } }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #262b4d; background: #0d1021; color: #fff; font-size: 13px; margin-top: 8px; user-select: text; }
    .btn { background: linear-gradient(90deg, #ff007f, #7928ca); color: #fff; border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 12px; cursor: pointer; }
    .btn-sec { background: #1e2340; font-size: 13px; padding: 10px; margin-top: 8px; }
    .status { text-align: center; font-size: 13px; color: #00f2fe; margin-top: 10px; font-weight: bold; }
    .results { display: none; }
    .score-val { font-size: 40px; font-weight: 900; color: #00f2fe; text-align: center; }
    .metric { margin: 10px 0; font-size: 13px; }
    .bar-bg { width: 100%; height: 8px; background: #0d1021; border-radius: 8px; margin-top: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: #ff007f; width: 0%; transition: width 0.6s; }
    .advice { background: #0d1021; border-left: 3px solid #ff007f; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>⚡ AI FACE SCANNER</h1>

  <div class="card">
    <div class="avatar-box">
      <img id="targetImg" src="" alt="Фото" style="display:none;">
      <span id="noPhotoText" style="font-size:12px; color:#8e92b2; text-align:center; padding:10px;">Нет фото</span>
      <div class="laser" id="laser"></div>
    </div>

    <div id="userName" style="text-align:center; font-weight:bold; font-size:15px; margin-bottom:6px;">Пользователь Telegram</div>
    <div class="status" id="statusText">Загружаем фото профиля...</div>

    <input type="text" id="urlInput" placeholder="Или вставь прямую ссылку на фото (https://...)">
    <button class="btn btn-sec" onclick="loadCustomUrl()">Загрузить по ссылке</button>

    <button class="btn" id="scanBtn" onclick="startScan()">⚡ Сканировать внешность</button>
  </div>

  <div class="card results" id="resultsCard">
    <div class="score-val" id="totalScore">0.0 / 10</div>
    <div id="archetypeTitle" style="text-align:center; font-weight:bold; margin-bottom:10px;">—</div>
    <div class="metric">⚖️ Симметрия: <b id="symVal">0%</b><div class="bar-bg"><div class="bar-fill" id="symBar"></div></div></div>
    <div class="metric">📐 Золотое сечение: <b id="goldVal">0%</b><div class="bar-bg"><div class="bar-fill" id="goldBar"></div></div></div>
    <div class="metric">👁 Взгляд: <b id="eyesVal">0%</b><div class="bar-bg"><div class="bar-fill" id="eyesBar"></div></div></div>
    <div class="metric">✨ Линия скул: <b id="jawVal">0%</b><div class="bar-bg"><div class="bar-fill" id="jawBar"></div></div></div>
    <div class="advice" id="adviceText"></div>
    <button class="btn btn-sec" onclick="shareResult()">📤 Поделиться результатом</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const targetImg = document.getElementById("targetImg");
    const noPhotoText = document.getElementById("noPhotoText");
    const statusText = document.getElementById("statusText");
    let userSeed = 100;
    let lastScore = "9.1";

    // 1. Автоматически берем аватарку и имя пользователя из Telegram
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("userName").innerText = user.first_name + (user.last_name ? " " + user.last_name : "");
      userSeed = user.id || 100;
      if (user.photo_url) {
        setPhoto(user.photo_url, "✅ Фото профиля Telegram загружено!");
      } else {
        statusText.innerText = "Вставь ссылку на фото или открой аватарку в настройках ТГ";
      }
    } else {
      statusText.innerText = "Вставь прямую ссылку на фото ниже 👇";
    }

    function setPhoto(url, msg) {
      targetImg.onload = () => {
        targetImg.style.display = "block";
        noPhotoText.style.display = "none";
        statusText.innerText = msg;
      };
      targetImg.onerror = () => {
        statusText.innerText = "❌ Не удалось открыть картинку по этой ссылке";
      };
      targetImg.src = url;
    }

    function loadCustomUrl() {
      const val = document.getElementById("urlInput").value.trim();
      if (!val) return;
      userSeed = val.length * 17;
      setPhoto(val, "✅ Фото по ссылке загружено!");
    }

    function startScan() {
      if (targetImg.style.display === "none") {
        statusText.innerText = "⚠️ Сначала загрузи фото (открой аватарку в ТГ или вставь ссылку)";
        return;
      }

      document.getElementById("laser").style.display = "block";
      document.getElementById("resultsCard").style.display = "none";
      statusText.innerText = "🔍 Сканируем черты лица...";

      setTimeout(() => {
        document.getElementById("laser").style.display = "none";

        // Уникальный расчет на основе ID пользователя / длины ссылки
        const sym = 84 + (userSeed % 14);
        const gold = 82 + ((userSeed * 3) % 15);
        const eyes = 86 + ((userSeed * 7) % 13);
        const jaw = 83 + ((userSeed * 5) % 14);
        lastScore = (8.0 + (((sym + gold + eyes + jaw) / 4 - 82) / 18) * 1.8).toFixed(1);

        document.getElementById("totalScore").innerText = lastScore + " / 10";
        document.getElementById("archetypeTitle").innerText = lastScore >= 9.0 ? "🔥 Модельная геометрия (Топ 5%)" : "✨ Гармоничный фотогеничный типаж";
        document.getElementById("adviceText").innerHTML = "<b>💡 Совет стилиста:</b> Отличный баланс пропорций! Мягкий фронтальный свет и ракурс чуть выше уровня глаз максимально подчеркнут черты лица.";
        document.getElementById("resultsCard").style.display = "block";

        ["sym", "gold", "eyes", "jaw"].forEach((k, i) => {
          const v = [sym, gold, eyes, jaw].at(i);
          document.getElementById(k + "Val").innerText = v + "%";
          document.getElementById(k + "Bar").style.width = v + "%";
        });

        statusText.innerText = "✅ Сканирование завершено!";
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      }, 1400);
    }

    function shareResult() {
      const txt = `⚡ AI-сканер оценил мою внешность на ${lastScore} из 10! Проверь свою аватарку тоже:`;
      tg.openTelegramLink(`https://t.me{encodeURIComponent(window.location.href)}&text=${encodeURIComponent(txt)}`);
    }
  </script>
</body>
</html>
