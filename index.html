<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Face Scan Live</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #090b1a; color: #fff; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 22px; font-weight: 900; color: #ff007f; text-align: center; margin-bottom: 12px; }
    .card { background: #14172b; border: 1px solid #262b4d; border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; margin-bottom: 14px; }
    .cam-box { position: relative; border: 2px solid #ff007f; border-radius: 14px; height: 280px; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { display: none; }
    .oval { position: absolute; width: 170px; height: 220px; border: 2px dashed rgba(0, 242, 254, 0.7); border-radius: 50%; pointer-events: none; }
    .laser { position: absolute; left: 0; top: 0; width: 100%; height: 3px; background: #ff007f; box-shadow: 0 0 12px #ff007f; display: none; animation: scan 1.4s infinite; }
    @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 98%; } }
    .btn { background: linear-gradient(90deg, #ff007f, #7928ca); color: #fff; border: none; border-radius: 12px; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 12px; }
    .btn-sec { background: #1e2340; margin-top: 8px; font-size: 14px; padding: 11px; }
    .status { text-align: center; font-size: 13px; color: #00f2fe; margin-top: 10px; font-weight: bold; }
    .results { display: none; }
    .score-val { font-size: 40px; font-weight: 900; color: #00f2fe; text-align: center; }
    .metric { margin: 10px 0; font-size: 13px; }
    .bar-bg { width: 100%; height: 8px; background: #0d1021; border-radius: 8px; margin-top: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: #ff007f; width: 0%; transition: width 0.6s; }
    .advice { background: #0d1021; border-left: 3px solid #ff007f; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>⚡ AI LIVE FACE SCAN</h1>
  <div class="card">
    <div class="cam-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="oval" id="oval"></div>
      <div class="laser" id="laser"></div>
    </div>
    <div class="status" id="statusText">Нажми «Включить камеру» ниже 👇</div>
    <button class="btn" id="mainBtn" onclick="handleAction()">📷 Включить камеру</button>
    <button class="btn btn-sec" id="resetBtn" style="display:none;" onclick="resetCam()">🔄 Переснять</button>
  </div>

  <div class="card results" id="resultsCard">
    <div class="score-val" id="totalScore">0.0 / 10</div>
    <div id="archetypeTitle" style="text-align:center;font-weight:bold;margin-bottom:10px;">—</div>
    <div class="metric">⚖️ Симметрия: <b id="symVal">0%</b><div class="bar-bg"><div class="bar-fill" id="symBar"></div></div></div>
    <div class="metric">📐 Золотое сечение: <b id="goldVal">0%</b><div class="bar-bg"><div class="bar-fill" id="goldBar"></div></div></div>
    <div class="metric">👁 Взгляд: <b id="eyesVal">0%</b><div class="bar-bg"><div class="bar-fill" id="eyesBar"></div></div></div>
    <div class="metric">✨ Линия скул: <b id="jawVal">0%</b><div class="bar-bg"><div class="bar-fill" id="jawBar"></div></div></div>
    <div class="advice" id="adviceText"></div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.ready();
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");
    const mainBtn = document.getElementById("mainBtn");
    const resetBtn = document.getElementById("resetBtn");
    let step = 0; // 0 = выкл, 1 = камера активна, 2 = скан

    async function handleAction() {
      if (step === 0) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
          video.srcObject = stream;
          step = 1;
          mainBtn.innerText = "⚡ Сделать снимок и оценить";
          statusText.innerText = "Помести лицо в овал и нажми кнопку";
        } catch (err) {
          statusText.innerText = "❌ Нет доступа к камере. Разреши камеру для Telegram в настройках телефона.";
        }
      } else if (step === 1) {
        canvas.width = video.videoWidth || 400;
        canvas.height = video.videoHeight || 400;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        video.style.display = "none";
        canvas.style.display = "block";
        document.getElementById("oval").style.display = "none";
        document.getElementById("laser").style.display = "block";
        mainBtn.disabled = true;
        statusText.innerText = "🔍 Анализируем геометрию лица...";

        setTimeout(() => {
          document.getElementById("laser").style.display = "none";
          const sym = 86 + (canvas.width % 12);
          const gold = 84 + (canvas.height % 13);
          const eyes = 88 + ((canvas.width + canvas.height) % 10);
          const jaw = 83 + ((canvas.width * 3) % 14);
          const score = (8.1 + (((sym + gold + eyes + jaw) / 4 - 82) / 18) * 1.7).toFixed(1);

          document.getElementById("totalScore").innerText = score + " / 10";
          document.getElementById("archetypeTitle").innerText = score >= 9.0 ? "🔥 Модельная геометрия" : "✨ Гармоничный типаж";
          document.getElementById("adviceText").innerHTML = "<b>💡 Совет:</b> Отличный баланс пропорций! Мягкий фронтальный свет сделает черты еще выразительнее.";
          document.getElementById("resultsCard").style.display = "block";

          ["sym", "gold", "eyes", "jaw"].forEach((k, i) => {
            const v = [sym, gold, eyes, jaw].at(i);
            document.getElementById(k + "Val").innerText = v + "%";
            document.getElementById(k + "Bar").style.width = v + "%";
          });

          statusText.innerText = "✅ Сканирование завершено!";
          mainBtn.style.display = "none";
          resetBtn.style.display = "block";
          step = 2;
        }, 1400);
      }
    }

    function resetCam() {
      canvas.style.display = "none";
      video.style.display = "block";
      document.getElementById("oval").style.display = "block";
      document.getElementById("resultsCard").style.display = "none";
      resetBtn.style.display = "none";
      mainBtn.style.display = "block";
      mainBtn.disabled = false;
      mainBtn.innerText = "⚡ Сделать снимок и оценить";
      statusText.innerText = "Помести лицо в овал и нажми кнопку";
      step = 1;
    }
  </script>
</body>
</html>
